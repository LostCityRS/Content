# Verification for this fork's content, on GitHub's runners instead of a laptop.
#
# The inherited version of this file checked out LostCityRS/Engine-TS - UPSTREAM's engine, not this
# fork's - and ran the pack and nothing else. Two things were wrong with that. The engine it built
# against does not have this fork's patches, so content that depends on them was being verified
# against an engine that cannot run it. And BUILD_VERIFY, which is on by default, compares the
# packed output against the ORIGINAL 377 checksums; this content is not original 377, so the build
# threw '.seq checksum mismatch!' before it got anywhere. Every push has been red for that reason,
# which is the same as having no CI at all.
#
# What runs now, on every push:
#   pack       - rs2check and the inv_transmit sweep, then a full build against THIS fork's
#                engine, then a check that the packed interfaces really do count the rune
#                pouch's runes
#   batteries  - the ten check batteries, one runner each so a failure names itself
#
# What runs when asked (Actions -> Verify Content -> Run workflow):
#   mutations  - the mutation harnesses, one runner each. These are the ones that take over an
#                hour on a laptop and have never once finished there.

name: Verify Content

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mutations:
        description: 'Also run the mutation harnesses (slow - the poh sweep alone is over an hour)'
        type: boolean
        default: false
      filter:
        description: 'Only mutations whose label contains this, e.g. 64 for one round'
        type: string
        default: ''
      engine_ref:
        # THE MIRROR OF sims.yml's content_ref, and it exists for the same reason. The three
        # ratchet steps in the pack job live in the ENGINE repository, so a content branch cannot
        # be checked against a ratchet that is still on an engine branch - and a tool that has not
        # reached 377-wip yet is not there to run at all. A dispatched run can name the engine
        # branch that carries it; a push cannot, which is why those steps also skip themselves when
        # the tool is missing rather than failing the build.
        description: 'Engine branch to build and take the ratchets from'
        type: string
        default: '377-wip'

# A new push supersedes the run it interrupted - but never a mutation run, which is why the event
# is part of the key.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  pack:
    name: rs2check, a full build, and the checks that need one
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4
      with:
        path: content

    # THIS fork's engine, not upstream's. BUILD_SRC_DIR defaults to ../content, which is why the
    # two are checked out as siblings.
    - uses: actions/checkout@v4
      with:
        repository: coreysho/DeathPlateau-Engine
        # `|| '377-wip'` and not the input alone: a push carries no inputs, so
        # github.event.inputs.engine_ref is empty there rather than defaulted.
        ref: ${{ github.event.inputs.engine_ref || '377-wip' }}
        path: engine
        # If Engine-TS is private, a plain checkout cannot reach it: GITHUB_TOKEN is scoped to this
        # repository only. Make a PAT with read access to it, save it as the ENGINE_TOKEN secret,
        # and uncomment the next line.
        # token: ${{ secrets.ENGINE_TOKEN }}

    # AND THE CLIENT, for the mutation-label step below. That step runs every checker as a
    # subprocess, and leprechaun_battery reads the client as well as the engine: with no client
    # beside content its two client checks print nothing, so the two labels naming them match no
    # check and the step fails on a missing checkout rather than on drift. Same repository and ref
    # as the battery's own job further down.
    - uses: actions/checkout@v4
      with:
        repository: coreysho/DeathPlateau-Client
        ref: dev-logging
        path: client

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # First, because it is seconds and its errors are the readable ones. It takes the script root
    # as the current directory and refuses to run anywhere else.
    - name: rs2check
      working-directory: content/scripts
      run: python ../tools/rs2check.py

    # Also seconds, and also needs no build: every inv_transmit must name a component the client
    # will give an inventory array to. One did not - the puzzle box transmitted to its Hint model
    # - and the symptom was not an empty window but a logout, because UPDATE_INV_FULL writes into
    # that array with no null check and readPacket's catch calls logout().
    - name: Every inv_transmit names an inv component
      working-directory: content
      run: python tools/invtransmit.py

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install
      working-directory: engine
      run: bun install

    # deploy.sh clears these so a stale pack cannot make a broken config look fine. A fresh
    # checkout has whatever was committed, which is exactly the stale case.
    - name: Clear the generated packs, the way deploy.sh does
      working-directory: content
      run: |
        rm -f pack/script.pack pack/param.pack pack/category.pack pack/enum.pack pack/struct.pack \
              pack/mesanim.pack pack/dbtable.pack pack/dbrow.pack pack/hunt.pack pack/varn.pack \
              pack/vars.pack

    - name: Pack
      # id, because the two `if: always()` ratchets below are guarded on this step's outcome.
      id: pack
      working-directory: engine
      env:
        # Off for the same reason deploy.sh turns it off: it checks the output against original
        # 377's checksums, and this content is not original 377.
        BUILD_VERIFY: 'false'
      run: |
        rm -f data/pack/server/script.dat data/pack/client/config
        bun run build

    # THE TWO RATCHETS, which belong here more than anywhere. The engine's nightly runs them too,
    # but a dead option or an unreachable trigger is almost always added by a CONTENT change - so
    # this is where the author finds out, on their own push, instead of a sweep at three in the
    # morning.
    #
    #   opsweep   every option the cache offers that no script answers.  2,734 and 1,005 of those
    #             on something the map actually places, as of writing.
    #   orphans   the inverse: every trigger written against an option the cache does not declare.
    #             None left, after this branch recovered all eighty-five.
    #   ifselect  every radio button whose handler stores a value its own highlight script in the
    #             cache does not agree with. Twenty-four baselined, all of them buttons in
    #             interfaces nobody has written yet.
    #
    # Both boot a world, and World refuses to start without a login key; it is gitignored, so a
    # fresh checkout has none and a throwaway per run is right. Nothing here signs anything a
    # player will see.
    #
    # EACH STEP SKIPS ITSELF IF ITS TOOL IS NOT IN THE ENGINE CHECKOUT, which is not defensiveness
    # for its own sake - it is the only honest behaviour. The tools live in the ENGINE repository
    # and this job checks out that repository at 377-wip, so a ratchet added on an engine branch
    # does not exist here until that branch merges. Without the guard the step dies with
    # ERR_MODULE_NOT_FOUND and takes the whole pack job with it, which is how these three were red
    # on every push for a day. Dispatch with engine_ref set to run them against a branch now.
    #
    # THE FRICTION IS DELIBERATE AND WORTH NAMING. The baselines live in the ENGINE repository
    # (engine/tools/sim/*-baseline.txt), so a content change that adds an entry on purpose cannot
    # be banked from a content pull request - it needs an engine one. That is the right shape for a
    # ratchet, whose whole job is to make a new entry cost something, and the wrong shape for
    # somebody editing a .loc who wants to get on with it. If it becomes a nuisance, the answer is
    # to move the baselines to this repository (they describe content, after all) rather than to
    # stop running the checks.
    - name: A login key for the ratchets
      id: loginkey
      working-directory: engine
      run: bun x tsx tools/server/rsa.ts

    - name: No option the cache offers goes unanswered
      working-directory: engine
      env:
        BUILD_SRC_DIR: ../content
      run: |
        if [ ! -f tools/sim/opsweep.ts ]; then
          echo "tools/sim/opsweep.ts is not in this engine checkout (${{ github.event.inputs.engine_ref || '377-wip' }}) - skipping."
          echo "The ratchet lives in the engine repository; until it reaches that branch there is"
          echo "nothing here to run. Dispatch this workflow with engine_ref set to the branch that"
          echo "carries it to check against it now."
          exit 0
        fi
        bun x tsx tools/sim/opsweep.ts --check

    # always() SO A RED OPSWEEP DOES NOT HIDE A RED ORPHANS - they are independent lists and a
    # push can add to both.
    #
    # AND GUARDED ON THE BUILD, because always() on its own meant "run even when the job never got
    # here". A red rs2check stops the job's normal steps, so neither bun install nor Pack ran -
    # and these two booted the engine anyway, failing with "bun: command not found" and then, once
    # bun was installed earlier, with "Cannot find package 'kleur'". One real failure came out as
    # three red steps, two of them about a toolchain that was never set up rather than about the
    # content. The exit-127 went into writing twice as a PATH problem in CI, which it never was.
    #
    # Both of these call H.boot(), so a built pack and a login key are not optional for them: with
    # no build there is no check to run and nothing for always() to protect. The guard keeps the
    # property that matters - once the build is green, each ratchet reports independently, and a
    # red opsweep still cannot hide a red orphans. DeathPlateau-Bugs#100.
    - name: No trigger is written against an option that does not exist
      if: always() && steps.pack.outcome == 'success' && steps.loginkey.outcome == 'success'
      working-directory: engine
      env:
        BUILD_SRC_DIR: ../content
      run: |
        if [ ! -f tools/sim/orphans.ts ]; then
          echo "tools/sim/orphans.ts is not in this engine checkout (${{ github.event.inputs.engine_ref || '377-wip' }}) - skipping."
          echo "The ratchet lives in the engine repository; until it reaches that branch there is"
          echo "nothing here to run. Dispatch this workflow with engine_ref set to the branch that"
          echo "carries it to check against it now."
          exit 0
        fi
        bun x tsx tools/sim/orphans.ts --check

    # The third one, and the one that catches wiring both of the above call fine. Thessalia's
    # women's trousers window had an [if_button] handler for every option and every option it
    # answered existed, and it still handed out the wrong trousers for six of its seven styles,
    # because the handlers were a button out of step with the window. A 377 radio button carries
    # its own highlight script naming the varp value that means "I am chosen"; this compares that
    # against what the handler stores.
    - name: No radio button stores a value its own highlight script disagrees with
      if: always() && steps.pack.outcome == 'success' && steps.loginkey.outcome == 'success'
      working-directory: engine
      env:
        BUILD_SRC_DIR: ../content
      run: |
        if [ ! -f tools/sim/ifselect.ts ]; then
          echo "tools/sim/ifselect.ts is not in this engine checkout (${{ github.event.inputs.engine_ref || '377-wip' }}) - skipping."
          echo "The ratchet lives in the engine repository; until it reaches that branch there is"
          echo "nothing here to run. Dispatch this workflow with engine_ref set to the branch that"
          echo "carries it to check against it now."
          exit 0
        fi
        bun x tsx tools/sim/ifselect.ts --check

    # Needs the build to have run - it decodes the packed archive the way the client's
    # Component.decode does, and asserts no packed script counts a pouch rune without a pouch twin.
    - name: The packed interfaces count the pouch runes
      working-directory: content
      run: python tools/pouchpacked.py

    # AND SO DOES poh_battery, since group 64b landed. It reads the engine's Player.ts for the
    # Graceful energy bonus and runs tools/objpacked.py against data/pack/server/obj.dat, so a
    # content-only runner fails it - which is what happened: three pushes red on
    # "poh_battery.py: Process completed with exit code 1" while the other seven batteries passed.
    # It lives here rather than in the matrix because this is the only job with both an engine and
    # a built cache, and duplicating the build to keep it in the matrix costs more than it saves.
    - name: Install the renderers poh_battery imports
      run: pip install pillow numpy

    - name: poh_battery
      working-directory: content
      run: python tools/poh_battery.py

    # Two minutes, and it is the drift nobody notices by hand: every mutation must name the check
    # it is written for, or "caught by its own check" is a sentence the harness cannot mean. 198 of
    # 521 had stopped naming one. It runs every checker, poh_battery among them, so it needs this
    # job's engine and built cache - which is also why it is here and not in the matrix.
    - name: Every mutation names the check it is written for
      working-directory: content
      run: python tools/mutate_labels.py

  batteries:
    name: ${{ matrix.script }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        script:
        # poh_battery.py is NOT here: it needs the engine and a built cache, so it runs in the
        # pack job above. See the note beside it there.
        - pet_battery.py
        - pouch_battery.py
        - compost_battery.py
        - bossart_battery.py
        - slayer_battery.py
        - maxcape_battery.py
        - superior_battery.py
        - fightcave_battery.py
        - combat_battery.py
        - clue_battery.py
        - boss_battery.py
        - enchant_battery.py
        - ancientbook_battery.py
        # barrows and follower need nothing but content, so they are plain matrix rows. gamemode
        # and leprechaun want sibling checkouts and run in the job below.
        - barrows_battery.py
        - follower_battery.py
        - windows_battery.py
        # every `while` loop that holds the player with p_delay, against a table of the ones where
        # the hold is the point. Two player reports and one sweep found the same fault in three
        # places (DeathPlateau-Bugs#39, #85, and glassblowing), so this is the ratchet for a fourth.
        - holdloop_battery.py
        - teleother_battery.py
        # the trading post: its windows, the barter inv going back, and the confirm clicks. The
        # market itself is checked in the engine repo, by tools/tradingpostcheck.ts.
        - tradingpost_battery.py
        # banktab_sim is a simulator, not a battery, but it also holds the CONTENT half of a
        # contract with Client.java - the bank grid's option wording, which is what the client
        # gates the placeholder Release option on. It was never in this matrix.
        - banktab_sim.py
        - certcheck.py
        # Every quest's reward scroll against what the quest actually pays. stat_advance takes
        # tenths of a point and a reward line is a string a human typed, so nothing tied the two
        # together: three quests were found paying a tenth, ten times and fifty over. Content only.
        - questxp_battery.py
        # Recipe for Disaster's ten sub-quest rewards against Old School's figures, and the one
        # instruction the quest used to withhold: the cake of guidance can only be made by Wizard
        # Traiborn, whose name appeared nowhere a player could read it. Written in November and
        # never listed here, so it did not catch the sub-quests paying a tenth. Content only.
        - rfd_battery.py
        # A quest may not record a step later than it spends the player's things: p_delay hands
        # the script back to the engine, and a player who clicks away in between keeps the loss
        # and not the progress. One of those cost a player the Feud.
        - questprogress_battery.py
        # The scroll writes "N Quest Point(s)" itself, and 43 quests also wrote that line into
        # their reward text. The proc now drops a first line that EXACTLY matches the one it is
        # about to print, so this holds all 43 to that exact wording - a loose match would eat a
        # reward written beside the points.
        - questscroll_battery.py
        # WAS IN NEITHER LIST and had never run in CI. It checks the three places a skilling tool
        # has to be wired - the obj param, the hardcoded axe ladder, the per-tree success table -
        # plus, now, the three places a TREE has to be wired and the Ent that spawns at it. It
        # reads only content and the .ob2 models beside it, so it is a plain matrix row.
        - skilltools_battery.py

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # The renderers the batteries import for their model and interface checks.
    - name: Install
      run: pip install pillow numpy

    - run: python tools/${{ matrix.script }}

  batteries-with-repos:
    name: ${{ matrix.script }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # THE FOUR THAT WERE IN NEITHER LIST are in both now. These two are here rather than in the
        # matrix above because they read a SIBLING repo: gamemode_battery reads Player.ts for the
        # xp multiplier and the xp lock's bit test, and leprechaun_battery reads the client too.
        # A battery that only checks the content half of a contract checks the half least likely to
        # be wrong - the engine is a separate checkout and is what gets left behind.
        script:
        - gamemode_battery.py
        - leprechaun_battery.py

    # NO ARGUMENTS BELOW, on purpose. Both batteries default to dirname(content)/engine and
    # dirname(content)/client, which is exactly this layout - so the paths cannot be passed wrong,
    # and running them here is the same command as running them on a laptop with the three repos
    # side by side.
    steps:
    - uses: actions/checkout@v4
      with:
        path: content

    - uses: actions/checkout@v4
      with:
        repository: coreysho/DeathPlateau-Engine
        # `|| '377-wip'` and not the input alone: a push carries no inputs, so
        # github.event.inputs.engine_ref is empty there rather than defaulted.
        ref: ${{ github.event.inputs.engine_ref || '377-wip' }}
        path: engine

    - uses: actions/checkout@v4
      with:
        repository: coreysho/DeathPlateau-Client
        ref: dev-logging
        path: client

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install the renderers the batteries import
      run: pip install pillow numpy

    - name: ${{ matrix.script }}
      working-directory: content
      run: python tools/${{ matrix.script }}

  mutations:
    name: ${{ matrix.script }}
    if: github.event_name == 'workflow_dispatch' && inputs.mutations
    runs-on: ubuntu-latest
    # A shard of poh's 266 is under two hours; the other harnesses are minutes.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        # poh_mutate IS SHARDED. 266 mutations at about a minute and a half each is six and a half
        # hours - past any job timeout, and the reason this sweep has never once finished. Four
        # shards bring it under two hours each. The other harnesses are small enough whole.
        script:
        - poh_mutate.py --shard 0/4
        - poh_mutate.py --shard 1/4
        - poh_mutate.py --shard 2/4
        - poh_mutate.py --shard 3/4
        - pet_mutate.py
        - pouch_mutate.py
        - compost_mutate.py
        - bossart_mutate.py
        - slayer_mutate.py
        - maxcape_mutate.py
        - superior_mutate.py
        - fightcave_mutate.py
        - combat_mutate.py
        - cert_mutate.py
        - clue_mutate.py
        - boss_mutate.py
        - enchant_mutate.py
        - ancientbook_mutate.py
        # THE OTHER HALF OF THE FOUR. barrows_mutate is 243 entries and was left out over a
        # sharding decision that turned out not to be needed: MEASURED end to end at about fifteen
        # minutes whole, well inside this job's timeout. The backlog's note read as "five minutes
        # an entry" and meant "five minutes for 105".
        #
        # Running it whole for the first time is also what paid for this round: one mutation
        # survived - deleting the chest window's inv_transmit - because the check was written
        # `in CHEST` and the reopen proc has a second transmit that kept it true. Scoped, and a
        # mutation added for the second one. A harness nobody runs is a harness nobody trusts.
        - teleother_mutate.py
        - barrows_mutate.py
        - follower_mutate.py
        - gamemode_mutate.py
        - leprechaun_mutate.py
        - windows_mutate.py

    # THE SAME SETUP AS THE pack JOB, copied rather than trimmed per harness. Every harness spawns
    # a checker, and poh_battery among them reads the engine source AND the packed cache - so a
    # runner without both makes group 64b fail for every mutation and report "caught, but by",
    # which is the pollution that makes a whole sweep worthless. Forty seconds of setup against
    # tens of minutes of mutations is not worth conditioning it per harness.
    steps:
    - uses: actions/checkout@v4
      with:
        path: content

    - uses: actions/checkout@v4
      with:
        repository: coreysho/DeathPlateau-Engine
        # `|| '377-wip'` and not the input alone: a push carries no inputs, so
        # github.event.inputs.engine_ref is empty there rather than defaulted.
        ref: ${{ github.event.inputs.engine_ref || '377-wip' }}
        path: engine

    # leprechaun_mutate spawns leprechaun_battery, which reads the client as well as the engine.
    - uses: actions/checkout@v4
      with:
        repository: coreysho/DeathPlateau-Client
        ref: dev-logging
        path: client

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install
      working-directory: engine
      run: bun install

    - name: Install the renderers the batteries import
      run: pip install pillow numpy

    - name: Pack
      working-directory: engine
      env:
        BUILD_VERIFY: 'false'
      run: bun run build

    # Through the environment rather than the command line, so a filter with a space or a quote in
    # it cannot become part of the command. Empty means every mutation in the shard.
    - name: Mutate
      working-directory: content
      env:
        FILTER: ${{ inputs.filter }}
      run: python tools/${{ matrix.script }} $FILTER
